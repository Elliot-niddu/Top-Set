<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrera dig – Gym Progress Tracker</title>
  <!-- Ligger sidan i files/ istället? Ändra till ../css/style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Gym Progress Tracker</h1>
    <nav>
      <a href="login.html">Logga in</a>
    </nav>
  </header>

  <main>
    <h2>Skapa konto</h2>

    <div id="message" role="alert"></div>

    <form action="" method="post">

      <div>
        <label for="username">Användarnamn</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div>
        <label for="email">E-post</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="password">Lösenord</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Registrera</button>
    </form>

    <p>Har du redan ett konto? <a href="login.html">Logga in</a></p>
  </main>

  <footer>
  
  </footer>

</body>
</html>
