<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in – Gym Progress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Gym Progress Tracker</h1>
    <nav>
      <a href="register.html">Skapa konto</a>
    </nav>
  </header>

  <main>
    <h2>Logga in</h2>

    <div id="message" role="alert"></div>

    <form action="" method="post">

      <div>
        <label for="login">Användarnamn eller e-post</label>
        <input type="text" id="login" name="login" required>
      </div>

      <div>
        <label for="password">Lösenord</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Logga in</button>
    </form>

    <p>Har du inget konto? <a href="register.html">Registrera dig</a></p>
  </main>

  <footer>
    <p>Gymnasiearbete – Teknikprogrammet</p>
  </footer>

</body>
</html>
